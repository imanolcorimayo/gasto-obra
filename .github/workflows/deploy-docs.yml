name: Deploy Docs & Admin to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'admin/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /var/www/gasto-obra
            git pull origin main
            echo "Deployed docs/admin: $(git log -1 --format='%h %s')"
