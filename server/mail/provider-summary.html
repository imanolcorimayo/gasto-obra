        <!-- Header -->
        <div class="header">
          <img src="https://go-api.wiseutils.com/static/img/logo.png" alt="Gasto Obra" class="header-logo">
          <h1>{{Project_Name}}</h1>
          <p class="subtitle">{{Address}}</p>
          <p class="subtitle" style="margin-top: 2px;">Tu resumen semanal</p>
        </div>

        <!-- Content -->
        <div class="content">
          <div class="date-badge">
            <span>{{Date}}</span>
          </div>

          <p class="greeting">Buen viernes 🙌 — acá va el resumen de lo que registraste esta semana.</p>

          <div class="context-bar">
            <strong>Obra:</strong> {{Project_Name}}<br>
            <strong>Cliente:</strong> {{Client_Name}}
          </div>

          {{Today_Blocks}}

          <hr class="divider">

          <h2 class="stats-title">Estado del proyecto</h2>
          <table class="stats-table">
            {{Stats_Rows}}
          </table>

          {{Provider_Expense_Section}}
        </div>

        <!-- CTA -->
        <div class="cta-wrap">
          <a href="{{View_Url}}" style="display: inline-block; background: linear-gradient(135deg, #E99A35, #FFAB40); color: #FFFFFF !important; padding: 13px 32px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 14px; mso-padding-alt: 0;">Ver proyecto</a>
        </div>
