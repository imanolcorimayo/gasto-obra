server {
    server_name admin.ima-gastoobra.com;
    listen 80;

    root /home/imanol/projects/wiseutils/gasto-obra/admin;
    index index.php;

    # Block internal directories and files
    location ^~ /includes/ { deny all; }
    location ^~ /pages/    { deny all; }
    location ^~ /lib/      { deny all; }
    location ^~ /docs/     { deny all; }
    location = /config.php { deny all; }
    location = /config.example.php { deny all; }

    # Front controller
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Only index.php is executable
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block all other PHP files
    location ~ \.php$ {
        deny all;
    }
}
