# ── gasto-obra admin rate limiting zones ───────────
# IMPORTANT: These must be placed in the http {} block of nginx.conf,
# NOT inside a server block.
limit_req_zone $binary_remote_addr zone=go_admin:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=go_admin_conn:10m;

server {
    server_name admin.gastoobra.com;

    access_log /var/log/nginx/gasto-obra/access-admin.log;
    error_log /var/log/nginx/gasto-obra/error-admin.log;

    root /var/www/gasto-obra/admin;
    index index.php;

    # ── Connection limit (15 per IP) ──────────────
    limit_conn go_admin_conn 15;
    limit_conn_status 429;

    # ── Block scanner paths (drop connection) ─────
    location ~* \.(env|git|sql|bak|log|ini|yml|yaml|toml|conf|cfg)$ { return 444; }
    location ~* ^/(\.env|\.git|\.aws|\.docker|\.github|\.vscode) { return 444; }
    location ~* ^/(wp-|wordpress|xmlrpc|admin\.php) { return 444; }
    location ~* ^/(phpinfo|phpmyadmin|adminer|wp-login) { return 444; }

    # Block internal directories and files
    location ^~ /includes/ { deny all; }
    location ^~ /pages/    { deny all; }
    location ^~ /lib/      { deny all; }
    location ^~ /docs/     { deny all; }
    location = /config.php { deny all; }
    location = /config.example.php { deny all; }

    # ── Pages, rate limited front controller ─────
    location / {
        limit_req zone=go_admin burst=10 nodelay;
        limit_req_status 429;

        try_files $uri /index.php?$query_string;
    }

    # Only index.php is executable
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block all other PHP files
    location ~ \.php$ {
        deny all;
    }

    # ── SSL (Cloudflare Origin Certificate) ──────
    listen 443 ssl;
    ssl_certificate /etc/ssl/cloudflare/gastoobra.pem;
    ssl_certificate_key /etc/ssl/cloudflare/gastoobra.key;

    # Redirect HTTP to HTTPS
    listen 80;
    if ($scheme = http) { return 301 https://$host$request_uri; }
}
